name: Terraform Infra

# El ambiente a desplegar depende de la rama, no de una matrix:
#   PR/push -> dev  => ambiente dev
#   PR/push -> uat  => ambiente uat
#   PR/push -> main => ambiente prod
# Flujo de promoción: feature branch -> PR a dev -> PR de dev a uat -> PR de uat a main.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev, uat, main]
    paths:
      - "infra/**"
      - "modules/**"
      - ".github/workflows/terraform-infra.yml"
  push:
    branches: [dev, uat, main]
    paths:
      - "infra/**"
      - "modules/**"
      - ".github/workflows/terraform-infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: infra
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  resolve:
    name: Resolver ambiente según la rama
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          case "$BRANCH" in
            dev) ENV=dev ;;
            uat) ENV=uat ;;
            main) ENV=prod ;;
            *)
              echo "Rama '$BRANCH' no está mapeada a ningún ambiente (dev/uat/main)."
              exit 1
              ;;
          esac
          echo "Rama '$BRANCH' -> ambiente '$ENV'"
          echo "env_name=$ENV" >> "$GITHUB_OUTPUT"

  validate:
    name: Format & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  tfsec:
    name: SAST (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

  plan:
    name: Plan
    needs: [resolve, validate, tfsec]
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ needs.resolve.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Seleccionar/crear workspace
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform workspace select "$TARGET_ENV" || terraform workspace new "$TARGET_ENV"

      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -var-file="envs/$TARGET_ENV.tfvars" -out=tfplan | tee plan_output.txt
          terraform show -no-color tfplan >> plan_output.txt

      - name: Upload plan artifact
        # Incluye también el .zip que genera data.archive_file (modules/lambda/.build/):
        # es un efecto local en disco durante el plan, no viaja dentro de tfplan, y el
        # job de apply corre en un runner nuevo que no lo tiene — hay que llevarlo a mano.
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            modules/lambda/.build/
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TARGET_ENV: ${{ needs.resolve.outputs.env_name }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.TF_WORKING_DIR}/plan_output.txt`;
            let body = fs.readFileSync(path, 'utf8');
            const maxLen = 55000;
            if (body.length > maxLen) {
              body = body.slice(-maxLen);
            }
            const comment = `### Terraform Plan — ${process.env.TARGET_ENV}\n<details><summary>Ver plan completo</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

  apply:
    name: Apply — requiere aprobación manual
    needs: [resolve, plan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.env_name }}
    concurrency:
      group: terraform-apply-${{ needs.resolve.outputs.env_name }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ needs.resolve.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Seleccionar/crear workspace
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform workspace select "$TARGET_ENV" || terraform workspace new "$TARGET_ENV"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: .

      - name: terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
